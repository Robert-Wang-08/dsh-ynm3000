<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210">
<style>text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }</style>
<rect width="1600" height="1210" fill="#FAFCFF"/>
<defs>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#2563EB"/>
  </marker>
</defs>
<rect width="1600" height="96" fill="#1E3A8A"/>
<text x="800" y="42" text-anchor="middle" font-size="36" font-weight="700" fill="#FFFFFF">New-device setup</text>
<text x="800" y="74" text-anchor="middle" font-size="22" fill="#93C5FD">Cloud drive (e.g. Nutstore) or template · env vars + keys · pack · optional group · verify</text>

<rect x="370" y="120" width="860" height="88" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
<rect x="370" y="120" width="5" height="88" rx="2" fill="#2563EB"/>
<circle cx="402" cy="154" r="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
<text x="402" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">1</text>
<text x="430" y="160" font-size="22" font-weight="700" fill="#1E3A8A">Run setup.ps1 (pin latest tag via explicit -Source)</text>
<text x="392" y="192" font-size="18" fill="#475569">▸ Asks whether a cloud drive exists; otherwise template / AI instructions</text>

<line x1="800" y1="208" x2="800" y2="222" stroke="#2563EB" stroke-width="2"/>
<line x1="430" y1="222" x2="1170" y2="222" stroke="#2563EB" stroke-width="2"/>
<line x1="430" y1="222" x2="430" y2="236" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1170" y1="222" x2="1170" y2="236" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
<text x="560" y="217" text-anchor="middle" font-size="18" fill="#1E3A8A">yes</text>
<text x="1040" y="217" text-anchor="middle" font-size="18" fill="#475569">no</text>

<rect x="90" y="236" width="680" height="140" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
<rect x="90" y="236" width="5" height="140" rx="2" fill="#2563EB"/>
<circle cx="122" cy="270" r="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
<text x="122" y="277" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">2</text>
<text x="150" y="276" font-size="22" font-weight="700" fill="#1E3A8A">Cloud drive: read answers (reference naming)</text>
<text x="112" y="310" font-size="18" fill="#475569">▸ drive-root/dsh-device/device.env — pointer names and routes only, no secrets</text>
<text x="112" y="338" font-size="18" fill="#475569">▸ optional device-answers.json / route-config.json; name yours the same way</text>

<rect x="830" y="236" width="680" height="140" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
<rect x="830" y="236" width="5" height="140" rx="2" fill="#94A3B8"/>
<circle cx="862" cy="270" r="16" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
<text x="862" y="277" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">2'</text>
<text x="890" y="276" font-size="22" font-weight="700" fill="#1E3A8A">No cloud drive: template or hand to AI</text>
<text x="852" y="310" font-size="18" fill="#475569">▸ fill templates/device-config.env.example into your local device dir</text>
<text x="852" y="338" font-size="18" fill="#475569">▸ or let an AI read docs/AI-DEVICE-SETUP.md, then place files in %USERPROFILE%\.dsh\device\</text>

<line x1="430" y1="376" x2="430" y2="404" stroke="#2563EB" stroke-width="2"/>
<line x1="1170" y1="376" x2="1170" y2="404" stroke="#2563EB" stroke-width="2"/>
<line x1="430" y1="404" x2="1170" y2="404" stroke="#2563EB" stroke-width="2"/>
<line x1="800" y1="404" x2="800" y2="432" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>

<rect x="370" y="432" width="860" height="88" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
<rect x="370" y="432" width="5" height="88" rx="2" fill="#2563EB"/>
<circle cx="402" cy="466" r="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
<text x="402" y="473" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">3</text>
<text x="430" y="472" font-size="22" font-weight="700" fill="#1E3A8A">Set DSHPACK_* user environment variables</text>
<text x="392" y="504" font-size="18" fill="#475569">▸ DSHPACK_KEY_* secrets are typed interactively, stored only in user env vars, never in files</text>

<line x1="800" y1="520" x2="800" y2="552" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
<rect x="370" y="552" width="860" height="88" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
<rect x="370" y="552" width="5" height="88" rx="2" fill="#2563EB"/>
<circle cx="402" cy="586" r="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
<text x="402" y="593" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">4</text>
<text x="430" y="592" font-size="22" font-weight="700" fill="#1E3A8A">Write route-config.json</text>
<text x="392" y="624" font-size="18" fill="#475569">▸ cloud-drive copy wins; an existing local file is kept unless -UpdateRoutes</text>

<line x1="800" y1="640" x2="800" y2="672" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
<rect x="370" y="672" width="860" height="110" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
<rect x="370" y="672" width="5" height="110" rx="2" fill="#2563EB"/>
<circle cx="402" cy="706" r="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
<text x="402" y="713" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">5</text>
<text x="430" y="712" font-size="22" font-weight="700" fill="#1E3A8A">install.ps1 installs the Git pack</text>
<text x="392" y="744" font-size="18" fill="#475569">▸ writes pnpm prerequisites → one dsh plugin add (bounded self-heal ≤3) → verifies bundle</text>
<text x="392" y="770" font-size="18" fill="#475569">▸ explicit -Source github:Robert-Wang-08/dsh-config-pack#v0.9.0 (built-in default may lag)</text>

<line x1="800" y1="782" x2="800" y2="814" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
<rect x="370" y="814" width="860" height="96" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2"/>
<rect x="370" y="814" width="5" height="96" rx="2" fill="#EA580C"/>
<circle cx="402" cy="848" r="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="1"/>
<text x="402" y="855" text-anchor="middle" font-size="18" font-weight="700" fill="#EA580C">6</text>
<text x="430" y="854" font-size="22" font-weight="700" fill="#9A3412">Install optional third-party group by default (skippable)</text>
<text x="392" y="886" font-size="18" fill="#475569">▸ recent-sessions · dshmarket · director · palette, added one by one</text>
<text x="392" y="912" font-size="18" fill="#475569">▸ -SkipOptional skips the whole group (on upgrade it also removes installed ones)</text>

<line x1="800" y1="910" x2="800" y2="942" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
<rect x="370" y="942" width="860" height="104" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
<rect x="370" y="942" width="5" height="104" rx="2" fill="#16A34A"/>
<circle cx="402" cy="976" r="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1"/>
<text x="402" y="983" text-anchor="middle" font-size="18" font-weight="700" fill="#16A34A">7</text>
<text x="430" y="982" font-size="22" font-weight="700" fill="#14532D">Verify (all three must pass)</text>
<text x="392" y="1014" font-size="18" fill="#475569">▸ dsh plugin --profile packed list · verify.mjs --profile packed</text>
<text x="392" y="1040" font-size="18" fill="#475569">▸ dump-config → verify --composed: 0 dangling; no "did not activate" / "patch not found"</text>

<line x1="800" y1="1046" x2="800" y2="1078" stroke="#2563EB" stroke-width="2" marker-end="url(#arr)"/>
<rect x="370" y="1078" width="860" height="88" rx="8" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2"/>
<rect x="370" y="1078" width="5" height="88" rx="2" fill="#2563EB"/>
<circle cx="402" cy="1112" r="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
<text x="402" y="1119" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">8</text>
<text x="430" y="1118" font-size="22" font-weight="700" fill="#1E3A8A">Restart DSH → open a new session</text>
<text x="392" y="1150" font-size="18" fill="#475569">▸ tool table freezes at session start; dispatch one subagent to prove the route works</text>
</svg>
