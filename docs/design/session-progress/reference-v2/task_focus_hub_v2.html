splay:flex;align-items:center;gap:3px;border-radius:7px}.tree-line.on{background:#edf3fe}.tree-link{min-width:0;flex:1;text-align:left;border:0;background:transparent;padding:7px 5px;display:flex;align-items:center;gap:6px;color:#54657f;font-size:12px}.tree-line.on .tree-link{color:#2855a4;font-weight:800}.tree-link:hover{color:#1d50a0}.tree-link .short{flex:0 0 auto;font-size:10px;opacity:.65}.tree-link .trname{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.fold{border:0;background:transparent;color:#8a9bb2;width:22px;height:27px;flex:0 0 22px;border-radius:5px}.fold:hover{background:#e5edf8}.tree-sub{margin-left:10px;padding-left:9px;border-left:1px solid #e5ebf3}.tree-panel .rule{margin:17px 0 13px;border-top:1px solid #edf1f6}.mini-note{line-height:1.6;font-size:11px;color:#8591a3}
.canvas{overflow:hidden}.canvas-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 19px 12px}.canvas-title{font-size:16px;font-weight:800;letter-spacing:-.2px}.canvas-subtitle{font-size:11px;color:var(--muted);margin-top:3px}.tools{display:flex;gap:8px;align-items:center}.tool-search{border:1px solid var(--line);width:155px;border-radius:8px;padding:8px 10px;background:#f9fbfe;font-size:11px;min-width:0}.filter-btn{border:1px solid #d7e1ee;padding:7px 10px;border-radius:8px;background:#fff;font-size:11px;color:#50647e;white-space:nowrap}.filter-btn.is-on{border-color:#5e91cb;background:#e7f2ff;color:#205fa4}.scope-note{margin:0 19px 10px;background:#f0f5fc;border:1px solid #e2ecfa;border-radius:9px;padding:9px 12px;font-size:11px;color:#60728e}.viz-wrap{padding:0 15px 15px;min-height:395px}.viz-scroll{overflow:auto;max-width:100%}.canvas-foot{display:flex;flex-wrap:wrap;gap:13px;padding:10px 18px 15px;border-top:1px solid #eff2f6;color:#8190a6;font-size:10px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px}.empty{display:flex;justify-content:center;align-items:center;padding:70px 12px;color:#9aa6b5;text-align:center}

.metro{min-width:780px}.metro-head,.rail{display:grid;grid-template-columns:205px minmax(410px,1fr) 90px;align-items:center;gap:7px}.metro-head{padding:10px 12px;color:#8d9aad;font-size:10px;letter-spacing:.5px}.stage-head{display:grid;grid-template-columns:repeat(5,1fr);text-align:center}.stage-head>span{padding:4px 0}.rail{padding:10px 12px;border-top:1px solid #eef2f7;min-height:72px}.rail:hover{background:#f8fbff}.rail.selected{background:#eef4ff;border-radius:8px;outline:1px solid #c8dafa}.rail-title{text-align:left;border:0;background:transparent;color:#263a55;min-width:0;padding:3px 5px}.rail-title strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px}.rail-title small{display:flex;align-items:center;gap:5px;color:#7e8ca0;font-size:10px;margin-top:3px}.track{position:relative;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;min-height:32px;border:0;background:none;padding:0;isolation:isolate}.track:before{content:"";height:4px;position:absolute;z-index:-2;top:calc(50% - 2px);left:10%;right:10%;border-radius:5px;background:#e2e8f1}.track:after{content:"";height:4px;position:absolute;z-index:-1;top:calc(50% - 2px);left:10%;width:calc(var(--pct) * .8);border-radius:5px;background:var(--trackcolor)}.station{display:flex;justify-content:center;align-items:center}.stop{display:block;width:13px;height:13px;border:2px solid #cad4e1;border-radius:50%;background:white}.stop.done{background:var(--trackcolor);border-color:var(--trackcolor)}.stop.active{width:19px;height:19px;border:4px solid var(--trackcolor);background:white;box-shadow:0 0 0 4px rgba(75,113,177,.10)}.stop.blocked{box-shadow:0 0 0 4px rgba(204,99,90,.25)}.rail-act{display:flex;justify-content:flex-end}.tiny-drill{background:white;color:#4266a8;font-size:11px;padding:6px 8px;border-radius:7px;border:1px solid #c9d9ef}.tiny-drill:hover{background:#eaf2fe}.no-child{font-size:10px;color:#a3aec0}
/* journey */
.svg-canvas{min-width:800px;overflow:auto}.svg-canvas svg{width:100%;min-width:870px;height:auto;display:block}.svg-canvas .svg-node{cursor:pointer}.svg-canvas .svg-node:hover .nodecard{stroke:#6e99de;stroke-width:2.5}.svg-canvas .svg-node.selected .nodecard{stroke:#315eaf;stroke-width:2.7;fill:#f0f5ff}.svg-canvas .svg-label{fill:#263a58;font-weight:700;font-size:13px}.svg-canvas .svg-small{fill:#7e8da4;font-size:11px}.svg-canvas .gate{fill:white;stroke:#395b8c;stroke-width:3}.svg-canvas .lane{fill:none;stroke-width:3;stroke-linecap:round;pointer-events:none}.diagram-info{font-size:11px;color:#8a98aa;margin:7px 2px 0}
/* dag */
.dag .svg-node:hover .nodecard{fill:#f3f7ff}.dag .nodecard{fill:white;stroke:#d3dfed;stroke-width:1.5}.dag .node-status{font-size:10px;fill:#6e819d}.dag .svg-node.selected .nodecard{fill:#ecf4ff;stroke:#3d6fbe;stroke-width:2.5}

.detail{padding:17px 16px 18px;position:sticky;top:12px}.detail-overline{font-size:10px;font-weight:800;color:#7d94b5;letter-spacing:1.3px}.detail h2{font-size:18px;line-height:1.4;margin:10px 0}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}.chip{background:#f2f5f9;color:#64758d;border-radius:6px;padding:5px 7px;font-size:10px}.chip.status-active{background:#eaf1ff;color:#4268b0}.chip.status-blocked{background:#fff0ec;color:#b75b51}.chip.status-done{background:#e6f6ef;color:#19816c}.chip.status-review{background:#fff4df;color:#a17129}.detail .sect{border-top:1px solid #edf1f6;padding:14px 0 0;margin-top:12px}.detail h3{font-size:11px;color:#72839b;margin:0 0 8px;font-weight:800;letter-spacing:.3px}.detail p{font-size:12px;line-height:1.7;margin:0;color:#455a74;overflow-wrap:anywhere}.next-action{padding:11px;background:#eff5ff;border-left:3px solid #6489c8;border-radius:0 8px 8px 0;font-size:12px;font-weight:650;color:#24466e;line-height:1.65}.detail .detail-drill{margin-top:15px;width:100%}.footer{max-width:1660px;padding:0 22px 24px;margin:auto;font-size:11px;color:#8996a8;line-height:1.6}

<body>
<header class="app-head">
 <div class="head-top"><div><div class="eyebrow">FOCUS HUB / MULTI-LEVEL TASK CONTROL</div><h1>进度总控 · 分层注意力地图</h1><p class="sub">一级目标 → 指定目标的二级节点 → 指定节点的三级任务 · 支持反向提升</p></div>
 <div class="head-right"><span class="sample-badge" id="sampleBadge">演示任务数据</span><button class="head-btn" id="exportBtn" type="button">导出 JSON</button><button class="head-btn" id="importBtn" type="button">导入 JSON</button><input id="importInput" type="file" accept=".json,application/json" hidden></div></div>
 <nav class="tabbar" id="viewTabs" aria-label="视图切换"><button type="button" class="tab active" data-view="metro">A · 地铁轨道</button><button type="button" class="tab" data-view="journey">B · 关卡路线</button><button type="button" class="tab" data-view="dag">C · DAG 依赖</button><button type="button" class="tab" data-view="board">D · 看板 + 折叠树</button></nav>
</header>
<main class="page">
 <div class="crumb-wrap"><span class="leveltag" id="levelTag">L1</span><div class="breadcrumbs" id="breadcrumbs" aria-label="层级导航"></div><div class="crumb-actions"><button class="outline" id="upBtn" type="button">↑ 返回上一级</button><button class="primary" id="drillBtn" type="button">↓ 下钻选中节点</button></div></div>
 <section class="summarybar" id="kpis"></section>
 <div class="workspace">
  <aside class="panel tree-panel"><div class="panel-title">任务归属树</div><div class="tree-intro">点击节点定位；箭头用于展开与折叠</div><div id="tree"></div><div class="rule"></div><div class="mini-note">树 = 归属关系；DAG = 依赖关系。不同项目不会因图形美观而被强行连接。</div></aside>
  <section class="panel canvas"><div class="canvas-head"><div><div class="canvas-title" id="vizTitle"></div><div class="canvas-subtitle" id="vizSubtitle"></div></div><div class="tools"><input id="searchInput" class="tool-search" placeholder="搜索本层节点" aria-label="搜索本层节点"><button class="filter-btn" id="focusBtn" type="button" aria-pressed="false">仅看重点</button></div></div><div class="scope-note" id="scopeNote"></div><div id="visualization" class="viz-wrap" aria-live="polite"></div><div class="canvas-foot"><span><i class="legend-dot" style="background:#4267b2"></i>蓝色 = 当前选中</span><span><i class="legend-dot" style="background:#cc6658"></i>红色 = 阻塞</span><span>阶段位置表示验收进度，而非聊天频次</span></div></section>
  <aside class="panel detail" id="inspector" aria-label="任务详情"></aside>
 </div>
</main>
<footer class="footer">原型 v2 · 完全离线 · 无外部依赖。所有数据均为演示；支持导入同结构 JSON。可通过点击任务、下钻、返回或面包屑操作。快捷键：Esc 返回上层。</footer>

<script>
(()=>{
'use strict';
const stages=['定义','建模','原型','验证','固化'];
const stat={ready:['待处理','#92a0b2'],active:['进行中','#4574c8'],blocked:['阻塞','#ca655b'],review:['待确认','#c89a47'],done:['已完成','#278f72'],parked:['暂缓','#9b98a6']};
const palette=['#4e76bf','#168e84','#9f7c3b','#7765b5','#bd6b62','#4e8b9d'];
const views={metro:'地铁式进度轨道',journey:'关卡行进 · 分支与汇合',dag:'DAG · 真实依赖关系',board:'任务看板 + 可折叠任务树'};
let data=JSON.parse(document.getElementById('seedData').textContent);
const state={path:[],selected:'P01',view:'metro',focus:false,query:'',collapsed:new Set(['P02','P03','P04'])};
let registry=new Map();
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shorten=(t,n=24)=>{let s=String(t||'');return s.length>n?s.slice(0,n-1)+'…':s};
const role=r=>({'goal':'业务/交付目标','technical-goal':'独立技术目标','capability':'能力/工作流','task':'执行任务'})[r]||'任务';
const status=s=>stat[s]||stat.ready;
function buildRegistry(){registry=new Map();const seen=new Set();function walk(node,parent,level){if(!node||typeof node.id!=='string'||!node.id)throw Error('每个节点必须包含非空 id');if(seen.has(node.id))throw Error('重复任务 ID：'+node.id);seen.add(node.id);if(level>3)throw Error('原型仅支持 L1–L3 三级任务');if(!Array.isArray(node.children))node.children=[];registry.set(node.id,{node,parent,level});node.children.forEach(n=>walk(n,node.id,level+1))}if(!data||!Array.isArray(data.projects)||!data.projects.length)throw Error('导入数据缺少 projects 数组');data.projects.forEach(p=>walk(p,null,1));}
function ref(id){return registry.get(id)}
function scope(){return state.path.length?ref(state.path[state.path.length-1])?.node:null}
function nodes(){return scope()?.children||data.projects}
function visible(){return nodes().filter(n=>(!state.focus||n.attention!=='parked')&&(!state.query||(`${n.title} ${n.id} ${n.next||''}`).toLowerCase().includes(state.query.toLowerCase())))}
function selected(){return ref(state.selected)?.node||null}
function level(){return state.path.length+1}
function canDrill(n){return !!(n&&level()<3&&visible().some(x=>x.id===n.id)&&Array.isArray(n.children)&&n.children.length>0)}
function select(id){if(!nodes().some(n=>n.id===id))return;state.selected=id;render()}
function drill(id){const n=ref(id)?.node;if(!canDrill(n))return;state.path.push(id);state.selected=n.children[0]?.id||null;state.query='';state.focus=false;state.collapsed.delete(id);render()}
function up(){if(!state.path.length)return;const last=state.path.pop();state.selected=last;state.query='';state.focus=false;render()}
function toLevel(target){if(!Number.isInteger(target)||target<1||target>level())return;if(target===level())return;const removed=state.path[target-1];state.path=state.path.slice(0,target-1);state.selected=removed||nodes()[0]?.id||null;state.query='';state.focus=false;render()}
function gotoNode(id){const item=ref(id);if(!item)return;const path=[];let parent=item.parent;while(parent){path.unshift(parent);parent=ref(parent)?.parent}state.path=path;state.selected=id;state.query='';state.focus=false;path.forEach(p=>state.collapsed.delete(p));render()}
function ensureSelected(){if(!nodes().some(n=>n.id===state.selected))state.selected=nodes()[0]?.id||null}
function renderNav(){const lvl=level(),s=scope(),v=visible(),a=v.filter(n=>n.status==='blocked').length,f=v.filter(n=>n.attention==='focus').length;
 el('levelTag').textContent='L'+lvl;
 let crumbs=`<button type="button" class="crumb ${lvl===1?'current':''}" data-level="1">L1 · 全部一级目标</button>`;
 if(lvl>=2){let p=ref(state.path[0])?.node;crumbs+=`<span class="crumbsep">›</span><button type="button" class="crumb ${lvl===2?'current':''}" data-level="2" title="${esc(p?.title)}">L2 · ${esc(p?.id||'')} ${esc(shorten(p?.title,18))}</button>`}
 if(lvl>=3){let p=ref(state.path[1])?.node;crumbs+=`<span class="crumbsep">›</span><button type="button" class="crumb current" data-level="3" title="${esc(p?.title)}">L3 · ${esc(p?.id||'')} ${esc(shorten(p?.title,18))}</button>`}
 el('breadcrumbs').innerHTML=crumbs;el('upBtn').disabled=lvl===1;const can=canDrill(selected());el('drillBtn').disabled=!can;el('drillBtn').textContent=can?`↓ 下钻 ${state.selected} → L${lvl+1}`:'↓ 选择有子节点的任务';
 el('kpis').innerHTML=`<div class="kpi"><div class="k-label">CURRENT SCOPE / 本层归属</div><div class="k-value" title="${esc(s?.title||'全局总览')}">${esc(s?`${s.id} · ${s.title}`:'全部一级目标')}</div><div class="k-foot">${lvl===1?'所有一级任务':`仅展示 ${esc(s?.id)} 的直接子节点`} · L${lvl}</div></div><div class="kpi"><div class="k-label">VISIBLE NODES</div><div class="k-value">${v.length} <span style="font-size:11px;color:#99a6b9">/ ${nodes().length}</span></div><div class="k-foot">当前层级，不累计下级</div></div><div class="kpi"><div class="k-label">KEY ATTENTION</div><div class="k-value">${f}</div><div class="k-foot">需要优先关注</div></div><div class="kpi"><div class="k-label">BLOCKERS</div><div class="k-value" style="color:${a?'#c35b53':'inherit'}">${a}</div><div class="k-foot">只计当前显示节点</div></div>`;
 el('vizTitle').textContent=views[state.view]+' · L'+lvl;el('vizSubtitle').textContent=lvl===1?'每行是一个独立的一级目标；不强行汇合':`父任务 ${s?.id||'—'} · ${s?.title||'—'} · 直接子任务 ${v.length} 个`;
 el('scopeNote').innerHTML=lvl===1?'当前是 <strong>L1 全局总览</strong>。选择任一一级目标，点击「下钻」查看该目标的 L2。':lvl===2?`当前是 <strong>L2：${esc(s?.id)} ${esc(s?.title)}</strong> 的下钻视图；不会混入其他一级目标的节点。选择本层某项可继续下钻 L3。`:`当前是 <strong>L3：${esc(s?.id)} ${esc(s?.title)}</strong> 的下钻视图；L1 归属为 ${esc(state.path[0])}。可以随时上升到 L2 或 L1。`;
 el('focusBtn').classList.toggle('is-on',state.focus);el('focusBtn').setAttribute('aria-pressed',String(state.focus));el('focusBtn').textContent=state.focus?'✓ 仅看重点':'仅看重点';el('searchInput').value=state.query;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-selected',String(b.dataset.view===state.view))});
}
function renderTree(){const active=state.selected;function rec(n){let children=n.children?.length>0,open=!state.collapsed.has(n.id);return `<div class="tree-item"><div class="tree-line ${n.id===active?'on':''}"><button class="tree-link" type="button" data-goto="${esc(n.id)}" title="${esc(n.title)}"><span class="short">${esc(n.id)}</span><span class="trname">${esc(n.title)}</span></button>${children?`<button class="fold" type="button" data-fold="${esc(n.id)}" aria-label="${open?'折叠':'展开'} ${esc(n.id)}" aria-expanded="${open}">${open?'⌄':'›'}</button>`:''}</div>${children&&open?`<div class="tree-sub">${n.children.map(rec).join('')}</div>`:''}</div>`}el('tree').innerHTML=data.projects.map(rec).join('')}
function color(i){return palette[i%palette.length]}
function renderMetro(items){if(!items.length)return '<div class="empty">本层没有符合筛选条件的节点</div>';let head=`<div class="metro-head"><span>任务 / 状态</span><div class="stage-head">${stages.map((x,i)=>`<span>0${i+1} · ${x}</span>`).join('')}</div><span style="text-align:right">操作</span></div>`;
 let rows=items.map((n,i)=>{let p=Math.max(0,Math.min(4,Number(n.stage)||0)),c=color(i),st=status(n.status),has=canDrill(n);return `<div class="rail ${state.selected===n.id?'selected':''}"><button class="rail-title" type="button" data-select="${esc(n.id)}" title="${esc(n.title)}"><strong>${esc(n.title)}</strong><small><span style="color:${st[1]}">●</span> ${esc(n.id)} · ${esc(st[0])}</small></button><button type="button" class="track" data-select="${esc(n.id)}" title="选择 ${esc(n.title)}，阶段：${esc(stages[p])}" style="--pct:${p*25}%;--trackcolor:${c}">${stages.map((_,j)=>`<span class="station"><span class="stop ${j<p?'done':j===p?'active':''} ${j===p&&n.status==='blocked'?'blocked':''}"></span></span>`).join('')}</button><div class="rail-act">${has?`<button type="button" class="tiny-drill" data-drill="${esc(n.id)}">下钻 ↘</button>`:'<span class="no-child">末级</span>'}</div></div>`}).join('');return `<div class="viz-scroll"><div class="metro">${head}${rows}</div></div>`}
function renderJourney(items){if(!items.length)return '<div class="empty">当前没有符合条件的节点</div>';let H=Math.max(370,130+items.length*106), gate=level()>1 && items.length>1,gateY=85+(items.length-1)*106/2, s=`<div class="svg-canvas"><svg viewBox="0 0 1100 ${H}" role="img" aria-label="关卡路线图"><text x="35" y="35" class="svg-small">TRACK / 本层节点</text><text x="405" y="35" class="svg-small">CURRENT STATION / 当前阶段</text><text x="940" y="35" class="svg-small">${gate?'PARENT MILESTONE / 父级关口':'OUTCOME / 独立目标'}</text>`;
 items.forEach((n,i)=>{let y=89+i*106,c=color(i),st=status(n.status),x=530+Math.min(4,Math.max(0,n.stage||0))*69;s+=`<path class="lane" d="M260 ${y} H${x}" stroke="${c}" opacity=".75"/>`;if(gate)s+=`<path class="lane" d="M${x+18} ${y} C885 ${y},875 ${gateY},1000 ${gateY}" stroke="${c}" opacity=".45"/>`;s+=`<g class="svg-node ${state.selected===n.id?'selected':''}" data-select="${esc(n.id)}" tabindex="0" role="button" aria-label="选择 ${esc(n.title)}"><rect x="35" y="${y-35}" width="${x-20}" height="70" fill="transparent" pointer-events="all"/><rect class="nodecard" x="35" y="${y-29}" rx="12" width="225" height="59"/><circle cx="54" cy="${y}" r="5" fill="${st[1]}"/><text class="svg-label" x="68" y="${y-5}">${esc(shorten(n.title,18))}</text><text class="svg-small" x="68" y="${y+13}">${esc(n.id)} · ${esc(st[0])}</text><circle cx="${x}" cy="${y}" r="14" fill="white" stroke="${c}" stroke-width="5"/><text class="svg-small" x="${x+25}" y="${y-11}">${esc(stages[n.stage]||'定义')}</text></g>`});if(gate){s+=`<circle class="gate" cx="1000" cy="${gateY}" r="19"/><circle cx="1000" cy="${gateY}" r="5" fill="#395b8c"/><text x="1000" y="${gateY+42}" text-anchor="middle" class="svg-small">${esc(scope()?.id||'')} 共享验收关口</text>`}return s+'</svg><div class="diagram-info">箭头/轨迹表示当前阶段；父级汇合代表一个验收关口，不自动表示子任务间存在依赖。点击节点选中，右侧可继续下钻。</div></div>'}
function dagLayers(items){const by=new Map(items.map(n=>[n.id,n]));let cache=new Map(),visiting=new Set();function layer(n){if(cache.has(n.id))return cache.get(n.id);if(visiting.has(n.id))return 0;visiting.add(n.id);let d=(n.dependsOn||[]).filter(k=>by.has(k));let l=d.length?1+Math.max(...d.map(id=>layer(by.get(id)))):0;visiting.delete(n.id);cache.set(n.id,l);return l}items.forEach(layer);return cache}
function renderDag(items){if(!items.length)return '<div class="empty">本层没有符合条件的节点</div>';let layers=dagLayers(items),columns=[...new Set([...layers.values()])].sort((a,b)=>a-b),groups=new Map(columns.map(c=>[c,items.filter(n=>layers.get(n.id)===c)])),w=Math.max(880,columns.length*270+70),h=Math.max(360,...[...groups.values()].map(a=>95+a.length*124));let pos=new Map(),s=`<div class="svg-canvas dag"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="当前层级依赖 DAG"><defs><marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#86a4c8" stroke-width="1.4"/></marker></defs>`;
 groups.forEach((arr,col)=>arr.forEach((n,i)=>{pos.set(n.id,{x:30+col*265,y:74+i*120})}));let nEdges=0;items.forEach(n=>(n.dependsOn||[]).forEach(dep=>{if(!pos.has(dep)||!pos.has(n.id))return;let a=pos.get(dep),b=pos.get(n.id);s+=`<path d="M${a.x+225} ${a.y+31} C${a.x+243} ${a.y+31},${b.x-18} ${b.y+31},${b.x-6} ${b.y+31}" fill="none" stroke="#96acc8" stroke-width="2" marker-end="url(#arrowHead)"/>`;nEdges++}));items.forEach(n=>{let p=pos.get(n.id),st=status(n.status);s+=`<g class="svg-node ${n.id===state.selected?'selected':''}" data-select="${esc(n.id)}" tabindex="0" role="button" aria-label="选择 ${esc(n.title)}"><rect class="nodecard" x="${p.x}" y="${p.y}" width="225" height="73" rx="11"/><circle cx="${p.x+18}" cy="${p.y+22}" r="5" fill="${st[1]}"/><text class="svg-label" x="${p.x+32}" y="${p.y+27}">${esc(shorten(n.title,18))}</text><text class="node-status" x="${p.x+17}" y="${p.y+55}">${esc(n.id)} · ${esc(st[0])}${n.children?.length?' · 可下钻':''}</text></g>`});return s+`</svg><div class="diagram-info">${nEdges?'已连接 '+nEdges+' 条在当前层级明确声明的依赖边。':'当前层级未声明直接依赖：节点保持独立，不生成虚构连线。'} 仅展示本层节点之间的依赖；点击节点查看详情。</div></div>`}
function renderBoard(items){const cols=[['ready','待处理'],['active','进行中'],['blocked','阻塞'],['review','待确认'],['done','已完成'],['parked','暂缓']];return `<div class="viz-scroll"><div class="board">${cols.map(([key,title])=>{let a=items.filter(n=>n.status===key);return `<div class="board-col"><div class="board-head">${title}<span class="count">${a.length}</span></div>${a.map(n=>`<div class="board-card ${n.id===state.selected?'selected':''}"><button class="board-link" data-select="${esc(n.id)}" type="button">${esc(n.title)}</button><div class="board-meta">${esc(n.id)} · ${esc(stages[n.stage]||'定义')}</div><div class="board-next">${esc(shorten(n.next,45))}</div>${canDrill(n)?`<button type="button" class="board-drill" data-drill="${esc(n.id)}">查看子任务 ↘</button>`:''}</div>`).join('')||'<div class="mini-note" style="text-align:center;padding:14px 0">—</div>'}</div>`}).join('')}</div><p class="board-note">左侧「任务归属树」可独立折叠；看板只展示当前父节点的直接子任务，状态变化不会改变归属。</p></div>`}
function renderDetail(){let n=selected();if(!n){el('inspector').innerHTML='<div class="empty">请选中一个当前层级任务</div>';return}let st=status(n.status),r=ref(n.id),can=canDrill(n),deps=(n.dependsOn||[]).filter(id=>registry.has(id));el('inspector').innerHTML=`<div class="detail-overline">FOCUS PANEL / 恢复信息</div><h2>${esc(n.title)}</h2><div class="chips"><span class="chip">${esc(n.id)} · L${r?.level||'?'}</span><span class="chip status-${esc(n.status)}">${esc(st[0])}</span><span class="chip">${esc(role(n.role))}</span></div><div class="sect"><h3>目标 / 为什么做</h3><p>${esc(n.summary||'未提供目标说明')}</p></div><div class="sect"><h3>下一步最小动作</h3><div class="next-action">${esc(n.next||'尚未确定')}</div></div><div class="sect"><h3>确认过的决策</h3><p>${esc(n.decision||'暂无已确认决定')}</p></div><div class="sect"><h3>依赖与证据</h3><p>前置依赖：${deps.length?esc(deps.join('、')):'未登记'}</p><p style="margin-top:5px">${esc(n.evidence||'未登记证据')}</p></div><div class="sect"><h3>来源 / 更新时间</h3><p>${esc(n.updated||'未登记')} · ${esc(n.owner||'待分配')}</p></div>${can?`<button class="primary detail-drill" type="button" data-drill="${esc(n.id)}">↓ 下钻 ${esc(n.id)} 的 L${level()+1} 子节点</button>`:level()===3?'<p class="mini-note" style="margin-top:14px">已到 L3 末级。可通过顶部面包屑反向提升。</p>':''}`}
function render(){ensureSelected();renderNav();renderTree();let arr=visible();el('visualization').innerHTML=state.view==='metro'?renderMetro(arr):state.view==='journey'?renderJourney(arr):state.view==='dag'?renderDag(arr):renderBoard(arr);renderDetail()}
function importData(d){data=d;buildRegistry();state.path=[];state.selected=data.projects[0].id;state.view='metro';state.query='';state.focus=false;state.collapsed=new Set(data.projects.slice(1).map(x=>x.id));el('sampleBadge').textContent='已导入数据';render()}
function downloadJson(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='focus-hub-tasks.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.addEventListener('click',event=>{let e=event.target.closest('[data-view],[data-select],[data-drill],[data-goto],[data-fold],[data-level]');if(e){if(e.hasAttribute('data-view')){state.view=e.dataset.view;render()}else if(e.hasAttribute('data-select'))select(e.dataset.select);else if(e.hasAttribute('data-drill'))drill(e.dataset.drill);else if(e.hasAttribute('data-goto'))gotoNode(e.dataset.goto);else if(e.hasAttribute('data-fold')){const id=e.dataset.fold;state.collapsed.has(id)?state.collapsed.delete(id):state.collapsed.add(id);renderTree()}else if(e.hasAttribute('data-level'))toLevel(Number(e.dataset.level));return}if(event.target.closest('#upBtn'))up();else if(event.target.closest('#drillBtn'))drill(state.selected);else if(event.target.closest('#focusBtn')){state.focus=!state.focus;render()}else if(event.target.closest('#exportBtn'))downloadJson();else if(event.target.closest('#importBtn'))el('importInput').click()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement?.tagName!=='INPUT'){up()}if((e.key==='Enter'||e.key===' ')&&e.target.closest('svg [data-select]')){e.preventDefault();select(e.target.closest('[data-select]').dataset.select)}});
el('searchInput').addEventListener('input',e=>{state.query=e.target.value;render()});
el('importInput').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());const previous=data;data=obj;try{buildRegistry()}catch(err){data=previous;buildRegistry();throw err}importData(obj);alert('导入成功：已载入 '+registry.size+' 个节点。')}catch(error){alert('导入失败：'+error.message)}e.target.value=''});
try{buildRegistry();render()}catch(e){el('visualization').innerHTML='<div class="empty">初始化失败：'+esc(e.message)+'</div>';console.error('Focus Hub init error',e)}
window.FocusHubTest={getState:()=>({level:level(),path:[...state.path],selected:state.selected,view:state.view,nodes:nodes().map(n=>n.id),visible:visible().map(n=>n.id)}),goto:gotoNode,drill,up,toLevel};
})();
</script>
